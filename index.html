<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F4F0E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>FamilyHealth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F4F0E9; --card:#FFFFFF; --ink:#22271F; --muted:#6E7568;
  --green:#175E4C; --green-deep:#0E4235; --green-soft:#DCE9E1;
  --amber:#B87514; --amber-deep:#7A4C0A; --amber-soft:#F6E7CC;
  --line:#E3DDD1; --r:14px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --disp:'Fraunces',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);display:flex;justify-content:center;}
.app{width:100%;max-width:460px;height:100dvh;display:flex;flex-direction:column;padding:12px 12px 0;}

header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 12px;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:8px;}
.logo{display:block;flex-shrink:0;cursor:pointer;}
.brand span{font-family:var(--disp);font-weight:600;font-size:17px;}
.hr{display:flex;align-items:center;gap:8px;}
.langbtn{min-width:38px;height:30px;padding:0 8px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-family:var(--sans);color:var(--muted);cursor:pointer;}
.bellbtn{position:relative;min-width:34px;padding:0 7px;font-size:14px;}
.bdot{position:absolute;top:2px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:1.5px solid var(--cream);display:none;}
.bdot.show{display:block;}
@media (max-width:409px){.brand span{display:none;}}
#remview,#platview{position:fixed;inset:0;background:var(--cream);z-index:40;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;}
.rv-wrap{width:100%;max-width:460px;padding:0 12px max(30px, env(safe-area-inset-bottom));}
.rv-bar{position:sticky;top:0;background:var(--cream);display:flex;justify-content:space-between;align-items:center;padding:16px 2px 10px;z-index:2;}
.rv-bar h3{font-size:18px;font-weight:600;}
.rv-bar button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:14px;cursor:pointer;color:var(--muted);}
.rv-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;}
.tabs{display:flex;background:#EAE4D8;border-radius:999px;padding:3px;}
.tabs button{position:relative;padding:6px 13px;font-size:13px;border-radius:999px;color:var(--muted);border:none;background:transparent;font-family:var(--sans);cursor:pointer;}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06);}
.tabs button .dot{position:absolute;top:4px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--amber);display:none;}
.tabs button .dot.show{display:block;}

.page{flex:1;min-height:0;display:none;flex-direction:column;}
.page.on{display:flex;}

/* ---------- Ask ---------- */
#chat{flex:1;overflow-y:auto;padding:4px 2px 12px;-webkit-overflow-scrolling:touch;}
.msg{max-width:85%;margin-bottom:10px;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.65;white-space:pre-wrap;}
.msg.bot{background:var(--card);border:1px solid var(--line);border-top-left-radius:6px;}
.msg.user{background:var(--green);color:#fff;margin-left:auto;border-top-right-radius:6px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 12px;}
.chips button{padding:8px 14px;font-size:13px;font-family:var(--sans);border:1.5px solid var(--green);color:var(--green-deep);background:#fff;border-radius:999px;cursor:pointer;}
.chips button:active{background:var(--green-soft);}
.chips button.sel{background:var(--green);color:#fff;border-color:var(--green);}
.icard{background:var(--card);border:1.5px solid var(--green);border-radius:var(--r);padding:14px;margin-bottom:12px;max-width:95%;}
.icard h3{font-size:14px;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.icard h3 i{width:8px;height:8px;border-radius:50%;background:var(--green);}
.irow{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed var(--line);}
.irow:last-of-type{border-bottom:none;}
.irow span:first-child{color:var(--muted);}
.icard .go{width:100%;margin-top:12px;padding:13px;font-size:15px;font-weight:500;font-family:var(--sans);background:var(--green);color:#fff;border:none;border-radius:11px;cursor:pointer;}
.icard .save{width:100%;margin-top:8px;padding:12px;font-size:14px;font-family:var(--sans);background:#fff;color:var(--green-deep);border:1.5px solid var(--green);border-radius:11px;cursor:pointer;}
.inputbar{display:flex;gap:8px;padding:10px 0 max(12px, env(safe-area-inset-bottom));flex-shrink:0;}
.inputbar input{flex:1;padding:12px 15px;font-size:15px;font-family:var(--sans);border:1.5px solid var(--line);border-radius:999px;background:#fff;outline:none;}
.inputbar input:focus{border-color:var(--green);}
.inputbar button{width:46px;height:46px;border-radius:50%;border:none;background:var(--green);color:#fff;font-size:17px;cursor:pointer;flex-shrink:0;}

/* ---------- Booking ---------- */
#bookScroll{flex:1;overflow-y:auto;padding-bottom:max(14px, env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.empty{background:var(--card);border:1px dashed #C9C2B2;border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8;margin-top:8px;}
.empty button{margin-top:12px;padding:11px 22px;font-size:14px;font-family:var(--sans);background:var(--green);color:#fff;border:none;border-radius:999px;cursor:pointer;}
.status{margin-bottom:12px;}
.phase{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;padding:3px 10px;border-radius:999px;margin-bottom:6px;}
.phase.agent{background:var(--green-soft);color:var(--green-deep);}
.phase.user{background:var(--amber-soft);color:var(--amber-deep);}
.phase .pulse{width:7px;height:7px;border-radius:50%;background:currentColor;}
@media (prefers-reduced-motion: no-preference){
  .pulse{animation:blink 1.4s ease-in-out infinite;}
  @keyframes blink{50%{opacity:.35;}}
  .cursor{animation:hunt 5s ease-in-out infinite;}
  @keyframes hunt{0%{transform:translate(30px,80px);}25%{transform:translate(210px,110px);}50%{transform:translate(110px,190px);}75%{transform:translate(240px,240px);}100%{transform:translate(30px,80px);}}
}
.status h1{font-size:24px;font-weight:600;line-height:1.25;}
.status .desc{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.6;}
.steps{display:flex;gap:5px;margin-top:10px;}
.steps i{flex:1;height:4px;border-radius:2px;background:#DDD6C7;}
.steps i.done{background:var(--green);}
.steps i.cur{background:var(--green);opacity:.45;}
.steps.user-cur i.cur{background:var(--amber);opacity:.6;}
.step-names{display:flex;justify-content:space-between;font-size:10px;color:#A9A294;margin-top:5px;}

.live{background:var(--card);border-radius:var(--r);overflow:hidden;border:2px solid var(--green);transition:border-color .3s;}
.live.user-mode{border-color:var(--amber);}
.chrome{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#FAF7F1;border-bottom:1px solid var(--line);}
.chrome .url{flex:1;font-size:11px;color:var(--muted);background:#EFEAE0;border-radius:999px;padding:4px 12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.badge{font-size:10px;letter-spacing:.08em;padding:3px 8px;border-radius:4px;font-weight:500;}
.badge.agent{background:var(--green);color:#fff;}
.badge.user{background:var(--amber);color:#fff;}
.viewport{position:relative;min-height:320px;padding:14px;}
.site-h{height:32px;background:#F0EDE6;border-radius:8px;margin-bottom:12px;display:flex;align-items:center;padding:0 12px;font-size:12px;color:#B0AA9C;}
.chbadge{display:none;font-size:10px;letter-spacing:.04em;padding:3px 9px;border-radius:999px;margin-left:6px;vertical-align:2px;}
.chbadge.api{display:inline-block;background:var(--green-soft);color:var(--green-deep);}
.chbadge.web{display:inline-block;background:var(--amber-soft);color:var(--amber-deep);}
.ledger{padding:4px 2px;}
.lrow{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.5;padding:9px 6px;border-bottom:1px dashed var(--line);}
.lck{color:var(--green);font-weight:700;flex-shrink:0;}
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;}
.pdot.green{background:var(--green);} .pdot.amber{background:var(--amber);} .pdot.gray{background:#B7B1A3;}
.plink{font-size:12px;color:var(--green-deep);text-decoration:underline;flex-shrink:0;}
.pitem{display:flex;justify-content:space-between;align-items:center;padding:15px 2px;border-bottom:1px solid var(--line);}
.pitem:last-of-type{border-bottom:none;}
.pname{font-size:15px;}
.sw{position:relative;width:47px;height:28px;border-radius:999px;border:none;background:#D8D2C4;cursor:pointer;flex-shrink:0;transition:background .2s;padding:0;}
.sw i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s;}
.sw.on{background:var(--green);}
.sw.on i{left:21px;}
.sw.dis{opacity:.4;}
.doc{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:#fff;opacity:0;transition:opacity .4s;}
.doc.in{opacity:1;}
.doc.dim{opacity:.4;}
.doc .av{width:38px;height:38px;border-radius:50%;background:#E4DFD3;flex-shrink:0;}
.doc .nm{font-size:13px;font-weight:500;}
.doc .sub{font-size:11px;color:var(--muted);margin-top:2px;}
.slotrow{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
.slot{font-size:11px;padding:4px 9px;border-radius:6px;background:var(--green-soft);color:var(--green-deep);border:1.5px solid transparent;cursor:pointer;}
.slot.sel{border-color:var(--amber);background:#FDF9F0;color:var(--amber-deep);font-weight:500;}
.cursor{position:absolute;width:14px;height:14px;pointer-events:none;z-index:5;}
.cursor::before{content:"";position:absolute;inset:3px;background:var(--green);border-radius:50%;}
.cursor::after{content:"";position:absolute;inset:-4px;border:1.5px solid var(--green);border-radius:50%;opacity:.5;}

.sheet{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px;margin-top:4px;}
.sheet h3{font-size:14px;font-weight:500;margin-bottom:10px;line-height:1.5;}
.cand{border:1.5px solid var(--line);border-radius:10px;padding:11px;margin-bottom:8px;cursor:pointer;}
.cand.sel{border-color:var(--amber);background:#FDF9F0;}
.cand .row{display:flex;justify-content:space-between;align-items:baseline;}
.cand .nm{font-size:13px;font-weight:500;}
.cand .fit{font-size:11px;color:var(--amber-deep);}
.cand .why{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;}

.formmock label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.formmock .fv{padding:9px 11px;font-size:14px;border:1.5px solid var(--line);border-radius:8px;background:#FCFBF8;margin-bottom:10px;min-height:38px;}
.formmock .fv.typing{border-color:var(--green);}

.login{max-width:290px;margin:14px auto 0;}
.login h4{font-size:14px;font-weight:500;margin-bottom:12px;text-align:center;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.field input{width:100%;padding:10px 12px;font-size:14px;font-family:var(--sans);border:1.5px solid var(--amber);border-radius:8px;background:#FFFDF8;outline:none;}
.ferr{font-size:12px;color:#A32D2D;margin-top:3px;display:none;}
.shield{display:flex;gap:8px;align-items:flex-start;margin-top:14px;padding:10px;background:var(--amber-soft);border-radius:10px;font-size:11px;color:var(--amber-deep);line-height:1.6;}
.shield svg{flex-shrink:0;margin-top:1px;}

.review{padding:4px 2px;}
.review h4{font-size:14px;font-weight:500;margin:6px 0 10px;}
.rrow{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line);}
.rrow span:first-child{color:var(--muted);}
.success{text-align:center;padding:26px 10px 10px;}
.success .ok{width:52px;height:52px;border-radius:50%;background:var(--green);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.success h4{font-size:17px;font-weight:600;margin-bottom:6px;}
.success p{font-size:13px;color:var(--muted);line-height:1.7;}

.actions{margin-top:12px;display:flex;flex-direction:column;gap:8px;}
.btn{width:100%;padding:14px;font-size:15px;font-weight:500;font-family:var(--sans);border-radius:12px;border:none;cursor:pointer;}
.btn.pg{background:var(--green);color:#fff;}
.btn.pa{background:var(--amber);color:#fff;}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted);}
.meta{display:flex;justify-content:space-between;font-size:11px;color:#A9A294;margin-top:10px;}
.meta button{border:none;background:none;font-size:11px;color:#A9A294;text-decoration:underline;cursor:pointer;font-family:var(--sans);}
#logbox{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;max-height:160px;overflow-y:auto;}
#logbox div{font-size:11px;color:var(--muted);padding:3px 0;border-bottom:1px dashed #EFEAE0;font-variant-numeric:tabular-nums;}
.hidden{display:none !important;}

/* ---------- Records ---------- */
#recScroll{flex:1;overflow-y:auto;padding-bottom:max(14px, env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;}
.rcard h3{font-size:14px;font-weight:600;margin-bottom:10px;}
.rhint{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.6;}
.mbar{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 12px;}
.mchip{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-family:var(--sans);color:var(--muted);cursor:pointer;}
.mchip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:500;}
.mchip.add{border-style:dashed;}
.mchip .mx{margin-left:4px;opacity:.85;}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.pf.full{grid-column:1 / -1;}
.pf label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.pf input,.pf select,#docCat{width:100%;padding:9px 11px;font-size:14px;font-family:var(--sans);border:1.5px solid var(--line);border-radius:8px;background:#FCFBF8;outline:none;}
.pf input:focus{border-color:var(--green);}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.thumb{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.thumb img{width:100%;height:88px;object-fit:cover;display:block;}
.thumb .tcat{position:absolute;left:0;bottom:0;right:0;font-size:10px;padding:3px 6px;background:rgba(34,39,31,.72);color:#fff;}
.thumb .tdel{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(34,39,31,.72);color:#fff;font-size:12px;line-height:22px;cursor:pointer;}
.ritem{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.ritem .rsub{font-size:11px;color:var(--muted);margin-top:2px;}
.ritem button{border:none;background:none;color:#A32D2D;font-size:12px;font-family:var(--sans);cursor:pointer;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--cream);font-size:13px;padding:10px 18px;border-radius:999px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}

/* ---------- 病历首页(医生视图,永远双语) ---------- */
#docview{position:fixed;inset:0;background:#fff;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.dv-bar{position:sticky;top:0;display:flex;justify-content:space-between;background:#fff;border-bottom:1px solid #ddd;padding:10px 14px;z-index:2;}
.dv-bar button{border:1px solid #ccc;background:#fff;border-radius:8px;padding:8px 14px;font-size:13px;font-family:var(--sans);cursor:pointer;}
#dv-body{max-width:640px;margin:0 auto;padding:20px 18px 60px;color:#111;}
#dv-body h2{font-family:var(--disp);font-size:20px;text-align:center;font-weight:600;}
#dv-body .dv-sub{text-align:center;font-size:11px;color:#666;margin:4px 0 18px;}
.dv-sec{margin-bottom:16px;}
.dv-sec h4{font-size:13px;letter-spacing:.06em;border-bottom:1.5px solid #111;padding-bottom:4px;margin-bottom:8px;font-weight:600;}
.dv-row{display:flex;font-size:13px;padding:4px 0;line-height:1.6;}
.dv-row b{width:150px;flex-shrink:0;font-weight:500;color:#555;}
.dv-cat{font-size:12px;color:#555;margin:8px 0 6px;}
.dv-imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.dv-imgs figure{margin:0;}
.dv-imgs figure img{width:100%;border:1px solid #ddd;border-radius:6px;display:block;}
.dv-imgs figcaption{font-size:11px;color:#666;margin-top:3px;}
@media print{
  .app,.toast,.no-print{display:none !important;}
  #docview{position:static;overflow:visible;}
  body{background:#fff;display:block;}
}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="brand"><svg class="logo" role="button" aria-label="integrations" onclick="openPlat()" width="26" height="26" viewBox="0 0 24 24"><path d="M12 2.4L22.2 10.4V21a1 1 0 0 1-1 1H2.8a1 1 0 0 1-1-1V10.4Z" fill="var(--green)"/><path d="M10.6 9.5h2.8v3.1h3.1v2.8h-3.1v3.1h-2.8v-3.1H7.5v-2.8h3.1Z" fill="#FFFDF8"/></svg><span>FamilyHealth</span></div>
  <div class="hr">
    <nav class="tabs">
      <button id="tab-rec" class="on" onclick="switchTab('rec')"><span id="tabRecT">档案</span></button>
      <button id="tab-ask" onclick="switchTab('ask')">Ask</button>
      <button id="tab-book" onclick="switchTab('book')"><span id="tabBookT">预约</span><span class="dot" id="bookDot"></span></button>
    </nav>
    <button class="langbtn bellbtn" id="bellBtn" onclick="openRem()" aria-label="reminders">🔔<span class="bdot" id="bellDot"></span></button>
    <button class="langbtn" id="langBtn" onclick="setLang(LANG==='zh'?'en':'zh')">EN</button>
  </div>
</header>

<!-- ============ ASK ============ -->
<div class="page" id="page-ask">
  <div class="mbar" id="memberBarAsk" style="margin:2px 0 8px;flex-shrink:0;"></div>
  <div id="chat"></div>
  <div class="inputbar">
    <input id="askInput" type="text" placeholder="" autocomplete="off">
    <button onclick="userSend()" aria-label="send">↑</button>
  </div>
</div>

<!-- ============ BOOKING ============ -->
<div class="page" id="page-book">
  <div id="bookScroll">
    <div class="empty" id="bookEmpty"></div>
    <div id="bookMain" class="hidden">
      <section class="status">
        <span id="phase" class="phase agent"><i class="pulse"></i><span id="phaseT"></span></span><span class="chbadge" id="chBadge"></span>
        <h1 id="stateT"></h1>
        <p class="desc" id="stateD"></p>
        <div class="steps" id="steps"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="step-names" id="stepNames"></div>
      </section>
      <section class="live" id="live">
        <div class="chrome">
          <span class="url" id="liveUrl">zocdoc.com</span>
          <span class="badge agent" id="badge"></span>
        </div>
        <div class="viewport" id="viewport"></div>
      </section>
      <section class="actions" id="act"></section>
      <div class="meta">
        <span id="metaL"></span>
        <button onclick="toggleLog()" id="logBtnT"></button>
      </div>
      <div id="logbox"></div>
    </div>
  </div>
</div>

<!-- ============ RECORDS ============ -->
<div class="page on" id="page-rec">
  <div id="recScroll">
    <div class="mbar" id="memberBar"></div>
    <button class="btn pg" id="btnGen" onclick="openDocView()" style="margin:4px 0 14px;"></button>

    <div class="rcard">
      <h3 id="h3Basic"></h3>
      <div class="pgrid">
        <div class="pf"><label id="lbName"></label><input id="pf-name"></div>

};

/* ================= 家庭成员 ================= */
if(!store.get('migrated_members')){
  ['profile','docs','asks','rems','bookings'].forEach(k=>{
    const v = store.get(k);
    if(v && !store.get(k+'_self')) store.set(k+'_self', v);
  });
  store.set('migrated_members', 1);
}
let members = store.get('members') || [{id:'self'}];
if(!store.get('members')) store.set('members', members);
let curM = store.get('curM') || 'self';
if(!members.find(m=>m.id===curM)) curM = 'self';
function mget(k){ return store.get(k+'_'+curM); }
function mset(k,v){ store.set(k+'_'+curM, v); }
function mName(m){ return m.id==='self' ? L().selfName : m.name; }
function curName(){ const m = members.find(x=>x.id===curM); return m ? mName(m) : L().selfName; }
function memberChipsHtml(){
  return members.map(m=>{
    const on = m.id===curM;
    const x = (on && m.id!=='self') ? ` <span class="mx" onclick="event.stopPropagation();delMember('${m.id}')">✕</span>` : '';
    return `<button class="mchip ${on?'on':''}" onclick="switchMember('${m.id}')">${mName(m)}${x}</button>`;
  }).join('') + `<button class="mchip add" onclick="addMember()">${L().addMember}</button>`;
}
function renderMembers(){
  ['memberBar','memberBarRem','memberBarAsk'].forEach(id=>{
    const el = $(id); if(el) el.innerHTML = memberChipsHtml();
  });
}
function reloadMemberData(){
  profile = mget('profile') || {};
  docs = mget('docs') || [];
  asks = mget('asks') || [];
  rems = mget('rems') || [];
}
function switchMember(id){
  if(id===curM) return;
  curM = id; store.set('curM', curM);
  reloadMemberData();
  renderMembers(); renderRecords(); renderRems(); updateBell();
}
function addMember(){
  const n = prompt(L().promptName);
  if(!n || !n.trim()) return;
  const m = {id:'m'+Date.now(), name:n.trim().slice(0,12)};
  members.push(m); store.set('members', members);
  switchMember(m.id);
}
function delMember(id){
  const m = members.find(x=>x.id===id);
  if(!m || id==='self') return;
  if(!confirm(L().delMemberAsk(mName(m)))) return;
  members = members.filter(x=>x.id!==id);
  store.set('members', members);
  ['profile','docs','asks','rems','bookings'].forEach(k=>{
    try{ localStorage.removeItem('hs_'+k+'_'+id); }catch(e){}
  });
  switchMember('self');
}

/* ================= Ask 对话引擎 ================= */
let intent = { specialty:null, reason:null, urgency:null, location:null, insurance:null, timePref:null };
let askStep = 'start';
let userSpoke = false;
let symptomBuf = '';
let missCount = 0;
let pendingSpec = null;
const chat = $('chat');
const askInput = $('askInput');
askInput.addEventListener('keydown', e=>{ if(e.key==='Enter') userSend(); });

function specChips(){ return Object.keys(SPEC).map(k=>spName(k)); }
function pushBot(text, chips){
  const m = document.createElement('div'); m.className='msg bot'; m.textContent=text; chat.appendChild(m);
  if(chips && chips.length){
    const c = document.createElement('div'); c.className='chips';
    chips.forEach(ch=>{ const b=document.createElement('button'); b.textContent=ch; b.onclick=()=>{ c.remove(); handleUser(ch,true); }; c.appendChild(b); });
    chat.appendChild(c);
  }
  chat.scrollTop = chat.scrollHeight;
}
function pushUser(text){
  const m = document.createElement('div'); m.className='msg user'; m.textContent=text; chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
}
function userSend(){
  const v = askInput.value.trim(); if(!v) return;
  askInput.value=''; handleUser(v,false);
}
function matchSpecialty(t){
  const low = t.toLowerCase().trim();
  for(const [k,c] of Object.entries(SPEC)){
    if(t.trim()===c.zh || low===c.en.toLowerCase()) return k;
    if(c.zh.length>1 && t.includes(c.zh.replace('科',''))) return k;
    if(c.kw.some(w=>low.includes(w))) return k;
  }
  return null;
}
function isRestart(t){
  return t===T.zh.restart || t===T.en.restart || t.includes('重新') || /start over/i.test(t);
}
function handleUser(text, isChip){
  userSpoke = true;
  pushUser(text);
  setTimeout(()=>askFlow(text,isChip), 350);
}
function isYesTxt(t){
  return t===T.zh.confirmYes || t===T.en.confirmYes || /^(对|是|好|嗯|行|yes|yeah|ok|sure)/i.test(t.trim());
}
function isNoTxt(t){
  return t===T.zh.confirmNo || t===T.en.confirmNo || /^(不|别|no|nah)/i.test(t.trim());
}
function askFlow(text, isChip){
  const l = L();
  if(askStep==='start'){
    symptomBuf = (symptomBuf + ' ' + text).trim();
    const sp = matchSpecialty(text) || matchSpecialty(symptomBuf);
    if(sp && isChip){
      intent.specialty = sp;
      askStep='urgency';
      pushBot(l.gotSpec(spName(sp)), l.urg);
    } else if(sp){
      pendingSpec = sp;
      intent.reason = symptomBuf;
      askStep='confirmSpec';
      pushBot(l.recSpec(spName(sp)), [l.confirmYes, l.confirmNo]);
    } else {
      missCount++;
      if(missCount>=2) pushBot(l.probeFallback, specChips());
      else pushBot(l.probe1);
    }
  } else if(askStep==='confirmSpec'){
    if(isYesTxt(text)){
      intent.specialty = pendingSpec;
      askStep='urgency';
      pushBot(l.gotSpec(spName(pendingSpec)), l.urg);
    } else if(isNoTxt(text)){
      pendingSpec = null; symptomBuf = ''; intent.reason = null; missCount = 0;
      askStep='start';
      pushBot(l.reAsk);
    } else {
      const sp2 = matchSpecialty(text);
      symptomBuf = (symptomBuf + ' ' + text).trim();
      intent.reason = symptomBuf;
      if(sp2) pendingSpec = sp2;
      pushBot(l.recSpec(spName(pendingSpec)), [l.confirmYes, l.confirmNo]);
    }
  } else if(askStep==='urgency'){
    intent.urgency = text; askStep='location';
    const last = store.get('intent');
    pushBot(l.locQ, last && last.location ? [l.lastPrefix+last.location] : []);
  } else if(askStep==='location'){
    intent.location = text.replace(T.zh.lastPrefix,'').replace(T.en.lastPrefix,''); askStep='insurance';
    const last = store.get('intent');
    const chips = ['Blue Shield','Kaiser','Anthem','Aetna', l.selfPay];
    if(last && last.insurance && !chips.includes(last.insurance)) chips.unshift(last.insurance);
    pushBot(l.insQ, chips);
  } else if(askStep==='insurance'){
    intent.insurance = text; askStep='time';
    pushBot(l.timeQ, l.time);
  } else if(askStep==='time'){
    intent.timePref = text; askStep='done';
    store.set('intent', intent);
    renderIntentCard();
  } else {
    if(isRestart(text)){ resetAsk(); return; }
    pushBot(l.doneHint, [l.restart]);
  }
}
function resetAsk(){
  intent = { specialty:null, reason:null, urgency:null, location:null, insurance:null, timePref:null };
  askStep='start'; symptomBuf=''; missCount=0; pendingSpec=null;
  pushBot(L().restartMsg);
}
function renderIntentCard(){
  const l = L();
  const c = document.createElement('div'); c.className='icard';
  c.innerHTML = `<h3><i></i>${l.icTitle}</h3>
    <div class="irow"><span>${l.icWho}</span><span>${curName()}</span></div>
    <div class="irow"><span>${l.icSpec}</span><span>${spName(intent.specialty)}</span></div>
    ${intent.reason?`<div class="irow"><span>${l.icReason}</span><span>${intent.reason}</span></div>`:''}
    <div class="irow"><span>${l.icUrg}</span><span>${intent.urgency}</span></div>
    <div class="irow"><span>${l.icLoc}</span><span>${intent.location}</span></div>
    <div class="irow"><span>${l.icIns}</span><span>${intent.insurance}</span></div>
    <div class="irow"><span>${l.icTime}</span><span>${intent.timePref}</span></div>
    <button class="go" onclick="startBooking()">${l.icGo}</button>
    <button class="save" onclick="saveAsk()">${l.icSave}</button>`;
  chat.appendChild(c);
  chat.scrollTop = chat.scrollHeight;
  $('bookDot').classList.add('show');
  pushBot(l.cardReady);
}

/* ================= Booking 状态机 ================= */
const B = { state:'idle', timers:[], startTs:null, tick:null, doctor:null, slot:null, log:[] };
function later(fn,ms){ const t=setTimeout(fn,ms); B.timers.push(t); }
function clearTimers(){ B.timers.forEach(clearTimeout); B.timers=[]; }
function chan(){ return (intent.specialty==='derm' && platState.zocdoc!==false) ? 'api' : 'web'; }
function ledger(rows, done){
  $('viewport').innerHTML = '<div class="ledger" id="ledgerBox"></div>';
  rows.forEach((r,i)=> later(()=>{
    const d = document.createElement('div'); d.className='lrow';
    d.innerHTML = '<span class="lck">✓</span><span>'+r+'</span>';
    $('ledgerBox').appendChild(d);
    logAdd(r);
  }, 400 + i*550));
  later(done, 400 + rows.length*550 + 600);
}
function logAdd(t){
  const ts = new Date().toLocaleTimeString(LANG==='zh'?'zh-CN':'en-US',{hour12:false});
  B.log.push(ts+' · '+t);
  const d = document.createElement('div'); d.textContent = ts+' · '+t;
  $('logbox').appendChild(d); $('logbox').scrollTop = $('logbox').scrollHeight;
}
function toggleLog(){ const b=$('logbox'); b.style.display = b.style.display==='block'?'none':'block'; }
function setStatus(o){
  $('phase').className = 'phase '+o.phase;
  $('phaseT').textContent = o.phaseT;
  $('stateT').textContent = o.title;
  $('stateD').textContent = o.desc;
  const steps = $('steps');
  steps.className = 'steps' + (o.phase==='user'?' user-cur':'');
  [...steps.children].forEach((el,i)=>{ el.className = i<o.step?'done':(i===o.step?'cur':''); });
  $('live').className = 'live' + (o.phase==='user'?' user-mode':'');
  const bd = $('badge'); bd.className='badge '+o.phase; bd.textContent = o.badge;
  if(o.url) $('liveUrl').textContent = o.url;
  $('act').innerHTML = o.act || '';
  const cb = $('chBadge');
  if(intent.specialty){
    const c = chan();
    cb.className = 'chbadge ' + c;
    cb.textContent = c==='api' ? L().chApi : L().chWeb;
  }else{
    cb.className = 'chbadge'; cb.textContent = '';
  }
}
function startTimer(){
  B.startTs = Date.now();
  if(B.tick) clearInterval(B.tick);
  B.tick = setInterval(()=>{
    const s = Math.floor((Date.now()-B.startTs)/1000);
    $('metaL').textContent = L().metaRun(String(B.startTs).slice(-4), Math.floor(s/60)+':'+String(s%60).padStart(2,'0'));
  }, 1000);
}
function switchTab(t){
  ['ask','book','rec'].forEach(k=>{
    $('tab-'+k).classList.toggle('on', t===k);
    $('page-'+k).classList.toggle('on', t===k);
  });
  if(t==='book') $('bookDot').classList.remove('show');
  if(t==='rec') renderRecords();
}
function startBooking(){
  switchTab('book');
  $('bookEmpty').classList.add('hidden');
  $('bookMain').classList.remove('hidden');
  stReady();
}

function stReady(){
  B.state='ready';
  const l = L();
  setStatus({phase:'agent', phaseT:l.phIdle, title:l.stReadyT, step:0, badge:l.bdIdle, url:'zocdoc.com',
    desc:`${curName()} · ${spName(intent.specialty)} · ${intent.location} · ${intent.insurance} · ${intent.timePref}`,
    act:`<button class="btn pg" onclick="stSearch()">${l.stReadyBtn}</button><button class="btn ghost" onclick="switchTab('ask')">${l.stReadyBack}</button>`});
  $('viewport').innerHTML = `<div class="site-h">${l.stReadyVp}</div><p class="rhint" style="padding:2px 4px 0;">${chan()==='api' ? l.chApiDesc : l.chWebDesc}</p>`;
}

function stSearch(){
  B.state='search'; clearTimers();
  if(!B.startTs) startTimer();
  const l = L();
  const spec = intent.specialty;
  if(chan()==='api'){
    const docs = MOCK_DOCS[spec] || MOCK_DOCS.default;
    setStatus({phase:'agent', phaseT:l.phAgent, title:l.stSearchT, step:1, badge:'API',
      url:'api.zocdoc.com/v1/providers',
      desc:l.stSearchD(spName(spec), intent.location, intent.insurance),
      act:''});
    ledger(l.apiSearch(spName(spec), intent.location, intent.insurance), ()=>stGate(docs.filter(d=>d.ins)));
    return;
  }
  setStatus({phase:'agent', phaseT:l.phAgent, title:l.stSearchT, step:1, badge:l.bdLive,
    url:`zocdoc.com/search?spec=${spec}`,
    desc:l.stSearchD(spName(spec), intent.location, intent.insurance),
    act:`<button class="btn ghost" onclick="pauseAgent()">${l.pauseBtn}</button>`});
  const docs = MOCK_DOCS[spec] || MOCK_DOCS.default;
  const vp = $('viewport');
  vp.innerHTML = `<div class="site-h">${l.loading}</div><div id="doclist"></div><div class="cursor"></div>`;
  logAdd(l.lg.open);
  later(()=>{ vp.querySelector('.site-h').textContent = l.results(spName(spec)); logAdd(l.lg.filter(intent.insurance)); }, 1000);
  docs.forEach((d,i)=>{
    later(()=>{
      const sl = d.slots[LANG];
      const el = document.createElement('div');
      el.className='doc';
      el.innerHTML = `<div class="av"></div><div><div class="nm">${d.n}</div><div class="sub">${spName(spec)} · ${d.r} ★ · ${d.d}${d.ins?'':l.noIns(intent.insurance)}</div>${sl.length?`<div class="slotrow">${sl.slice(0,2).map(s=>`<span class="slot">${s}</span>`).join('')}</div>`:''}</div>`;
      $('doclist').appendChild(el);
      requestAnimationFrame(()=>el.classList.add('in'));
      if(!d.ins) later(()=>{ el.classList.add('dim'); logAdd(l.lg.exclude(d.n)); }, 700);
    }, 1600 + i*800);
  });
  later(()=>{ logAdd(l.lg.sort); stGate(docs.filter(d=>d.ins)); }, 5200);
}

function stGate(cands){
  B.state='gate'; clearTimers();
  const l = L();
  B.doctor = cands[0]; B.slot = cands[0].slots[LANG][0];
  setStatus({phase:'user', phaseT:l.phWaitU, title:l.gateT, step:2, badge:l.bdPaused,
    desc:l.gateD,
    act:`<button class="btn pa" onclick="stForm()">${l.gateGo}</button><button class="btn ghost" onclick="stSearch()">${l.gateNo}</button>`});
  const vp = $('viewport');
  vp.innerHTML = `<div class="sheet"><h3>${l.gateH(cands.length)}</h3>
    ${cands.map((d,i)=>`
      <div class="cand ${i===0?'sel':''}" data-i="${i}">
        <div class="row"><span class="nm">${d.n}</span><span class="fit">${i===0?l.gateBest:''}</span></div>
        <p class="why">${d.r} ★ · ${d.d} · ${l.takesIns(intent.insurance)} · ${d.best[LANG]}</p>
        <div class="slotrow">${d.slots[LANG].map((s,j)=>`<span class="slot ${i===0&&j===0?'sel':''}" data-i="${i}" data-s="${s}">${s}</span>`).join('')}</div>
      </div>`).join('')}
  </div>`;
  vp.querySelectorAll('.cand').forEach(c=>{
    c.addEventListener('click', ()=>{
      vp.querySelectorAll('.cand').forEach(x=>x.classList.remove('sel'));
      c.classList.add('sel');
      const i = +c.dataset.i; B.doctor = cands[i]; B.slot = cands[i].slots[LANG][0];
      vp.querySelectorAll('.slot').forEach(s=>s.classList.toggle('sel', s.dataset.i==c.dataset.i && s.dataset.s===B.slot));
    });
  });
  vp.querySelectorAll('.slot').forEach(s=>{
    s.addEventListener('click', e=>{
      e.stopPropagation();
      const i = +s.dataset.i; B.doctor = cands[i]; B.slot = s.dataset.s;
      vp.querySelectorAll('.cand').forEach(x=>x.classList.toggle('sel', +x.dataset.i===i));
      vp.querySelectorAll('.slot').forEach(x=>x.classList.remove('sel'));
      s.classList.add('sel');
    });
  });
  logAdd(l.lg.wait1);
}

function stForm(){
  B.state='form'; clearTimers();
  const l = L();
  logAdd(l.lg.picked(B.doctor.n, B.slot));
  if(chan()==='api'){
    setStatus({phase:'agent', phaseT:l.phAgent, title:l.formT, step:3, badge:'API',

}

function compressImg(file){
  return new Promise(res=>{
    const r = new FileReader();
    r.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const M = 900; let w = img.width, h = img.height;
        if(Math.max(w,h) > M){ const k = M/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        res(c.toDataURL('image/jpeg', 0.6));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

function saveRem(){
  const l = L();
  const type = $('rm-type').value;
  const title = $('rm-title').value.trim();
  if(!title){ $('rm-title').focus(); return; }
  const rem = {id:Date.now()+Math.random(), type, title};
  if(type==='med'){
    const times = [...$('medTimes').querySelectorAll('button.sel')].map(b=>b.dataset.t);
    if(!times.length) return;
    const days = parseInt($('rm-days').value,10) || 7;
    const st = new Date(); st.setHours(0,0,0,0);
    rem.times = times; rem.days = days; rem.start = st.getTime();
  }else{
    const v = $('rm-when').value;
    rem.when = v ? new Date(v).getTime() : null;
  }
  rems.unshift(rem); mset('rems', rems);
  $('remForm').classList.add('hidden');

function delRem(id){ rems = rems.filter(r=>r.id!==id); mset('rems', rems); renderRems(); updateBell(); }
function setRemWhen(id, v){
  const r = rems.find(x=>x.id===id);
  if(r){ r.when = v ? new Date(v).getTime() : null; mset('rems', rems); renderRems(); toast(L().remSaved); updateBell(); }
}
function nextOcc(r){
  const now = Date.now();
  if(r.type==='med'){
    for(let d=0; d<r.days; d++){
      const day = new Date(r.start + d*86400000);
      for(const t of r.times){
        const [h,m] = t.split(':').map(Number);
        const ts = new Date(day.getFullYear(), day.getMonth(), day.getDate(), h, m).getTime();
        if(ts > now) return ts;
      }
    }
    return null;
  }
  return (r.when && r.when > now) ? r.when : null;
}
function fmtTs(ts){
  return new Date(ts).toLocaleString(LANG==='zh'?'zh-CN':'en-US',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
}
function renderRems(){
  const l = L();
  $('remList').innerHTML = rems.map(r=>{
    const nx = nextOcc(r);
    const typeL = l.rType[r.type] || r.type;
    let sub;
    if(r.type!=='med' && !r.when){
      sub = `${l.noTime} <input type="datetime-local" style="font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;margin-top:3px;" onchange="setRemWhen(${r.id},this.value)">`;
    }else{
      sub = nx ? (l.nextAt + fmtTs(nx)) : l.past;
    }
    return `<div class="ritem"><div style="min-width:0;"><div>${typeL} · ${r.title}</div><div class="rsub">${sub}</div></div><div style="display:flex;gap:12px;align-items:center;flex-shrink:0;"><button style="color:var(--green-deep);" onclick="calRem(${r.id})">${l.addCal}</button><button onclick="delRem(${r.id})">${l.del}</button></div></div>`;
  }).join('') || `<p class="rhint" style="margin:0;">${l.remEmpty}</p>`;
}
function icsDt(ts){
  const d = new Date(ts), p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'T'+p(d.getHours())+p(d.getMinutes())+'00';
}
function calRem(id){
  const r = rems.find(x=>x.id===id); if(!r) return;
  const esc = s=>String(s).replace(/([,;])/g,'\\$1');
  const ev = [];
  if(r.type==='med'){
    r.times.forEach((t,i)=>{
      const [h,m] = t.split(':').map(Number);
      const st = new Date(r.start); st.setHours(h,m,0,0);
      ev.push('BEGIN:VEVENT\nUID:'+r.id+'-'+i+'@familyhealth\nDTSTART:'+icsDt(st.getTime())+'\nDURATION:PT15M\nRRULE:FREQ=DAILY;COUNT='+r.days+'\nSUMMARY:'+esc('💊 '+r.title)+'\nBEGIN:VALARM\nACTION:DISPLAY\nDESCRIPTION:'+esc(r.title)+'\nTRIGGER:PT0M\nEND:VALARM\nEND:VEVENT');
    });
  }else{
    if(!r.when){ toast(L().noTime); return; }
    ev.push('BEGIN:VEVENT\nUID:'+r.id+'@familyhealth\nDTSTART:'+icsDt(r.when)+'\nDURATION:PT30M\nSUMMARY:'+esc(r.title)+'\nBEGIN:VALARM\nACTION:DISPLAY\nDESCRIPTION:'+esc(r.title)+'\nTRIGGER:-PT30M\nEND:VALARM\nEND:VEVENT');
  }
  const ics = 'BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//FamilyHealth//Reminders//EN\n'+ev.join('\n')+'\nEND:VCALENDAR';
  const blob = new Blob([ics.replace(/\n/g,'\r\n')], {type:'text/calendar'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'familyhealth-reminder.ics';
  document.body.appendChild(a); a.click(); a.remove();
}
function askNotif(){
  if(!('Notification' in window)){ toast(L().notifNo); return; }
  Notification.requestPermission().then(p=>{ toast(p==='granted' ? L().notifOn : L().notifNo); });
}
function fireRem(key, title){
  if(fired[key]) return;
  fired[key] = 1; store.set('fired', fired);
  toast(L().dueNow(title));
  if(('Notification' in window) && Notification.permission==='granted'){
    try{ new Notification('FamilyHealth', {body:title}); }catch(e){}
  }
}
function checkDue(){
  const now = Date.now(), win = 90000;
  members.forEach(mb=>{
    const list = mb.id===curM ? rems : (store.get('rems_'+mb.id) || []);
    const tag = members.length>1 ? mName(mb)+' · ' : '';
    list.forEach(r=>{
      if(r.type==='med'){
        const today = new Date(); today.setHours(0,0,0,0);
        const dayIdx = Math.floor((today.getTime()-r.start)/86400000);
        if(dayIdx<0 || dayIdx>=r.days) return;
        r.times.forEach(t=>{
          const [h,m] = t.split(':').map(Number);
          const ts = new Date(today.getFullYear(), today.getMonth(), today.getDate(), h, m).getTime();
          if(now>=ts && now-ts<win) fireRem(r.id+'|'+today.toDateString()+'|'+t, tag+'💊 '+r.title);
        });
      }else if(r.when && now>=r.when && now-r.when<win){
        fireRem(r.id+'|once', tag+r.title);
      }
    });
  });
}

  $('platview').classList.add('hidden');
  document.body.style.overflow = '';
}

/* ================= 语言应用 ================= */
function applyLang(){
  const l = L();
  document.documentElement.lang = LANG==='zh' ? 'zh-CN' : 'en';
  $('langBtn').textContent = l.langBtn;
  $('tabBookT').textContent = l.tabBook;
  $('tabRecT').textContent = l.tabRec;
  askInput.placeholder = l.ph;
  $('bookEmpty').innerHTML = l.bkEmpty + `<br><button onclick="switchTab('ask')">${l.bkGoAsk}</button>`;
  $('stepNames').innerHTML = l.stepNames.map(s=>`<span>${s}</span>`).join('');
  if(!B.startTs) $('metaL').textContent = l.metaIdle;
  $('logBtnT').textContent = l.logBtn;
  /* records */
  $('btnGen').textContent = l.recGen;
  $('h3Basic').textContent = l.basic;
  ['Name','Birth','Sex','Blood','Marital','Addr','Allergy','Meds','Chronic','Family'].forEach(k=>{
    $('lb'+k).textContent = l['lb'+k];
  });
  $('pf-name').placeholder = l.phName;
  $('pf-addr').placeholder = l.phAddr;
  $('pf-allergy').placeholder = l.phAllergy;
  $('pf-meds').placeholder = l.phMeds;
  $('pf-chronic').placeholder = l.phChronic;
  $('pf-family').placeholder = l.phFamily;
  const sx = $('pf-sex');
  sx.options[0].text = l.optNA; sx.options[1].text = SEXL.M[LANG]; sx.options[2].text = SEXL.F[LANG];
  const mr = $('pf-marital');
  mr.options[0].text = l.optNA;
  ['single','married','divorced','widowed'].forEach((k,i)=>{ mr.options[i+1].text = MARL[k][LANG]; });
  const dc = $('docCat'); const cur = dc.value;
  dc.innerHTML = Object.keys(CATS).map(k=>`<option value="${k}">${catName(k)}</option>`).join('');
  if(cur && CATS[cur]) dc.value = cur;
  $('btnSaveProf').textContent = l.saveProf;
  $('h3Photo').textContent = l.photoH;
  $('photoHint').textContent = l.photoHint;
  $('btnPhoto').textContent = l.photoBtn;
  $('h3Hist').textContent = l.histH;
  $('h3Rem').textContent = l.h3Rem;
  $('remHint').textContent = l.remHint;
  $('btnAddRem').textContent = l.btnAddRem;
  $('btnNotif').textContent = l.btnNotif;
  $('lbRType').textContent = l.lbRType;
  $('lbRTitle').textContent = l.lbRTitle;
  $('lbRWhen').textContent = l.lbRWhen;
  $('lbRTimes').textContent = l.lbRTimes;
  $('lbRDays').textContent = l.lbRDays;
  $('rm-title').placeholder = l.phRTitle;
  const rt = $('rm-type');
  rt.options[0].text = l.rType.med; rt.options[1].text = l.rType.check; rt.options[2].text = l.rType.appt;
  $('btnSaveRem').textContent = l.btnSaveRem;
  renderMembers();
  if($('page-rec').classList.contains('on')) renderRecords();
  if(B.state==='ready') stReady();
}
function setLang(lg){
  LANG = lg; store.set('lang', lg);
  applyLang();
  if(askStep==='start' && !userSpoke){
    chat.innerHTML = '';
    symptomBuf=''; missCount=0; pendingSpec=null;
    pushBot(L().greet);
  }
}

/* ================= 启动 ================= */
applyLang();
buildMedChips();
onRemType();
setInterval(checkDue, 30000);
checkDue();
updateBell();
renderRecords();
pushBot(L().greet);
</script>
